name: Android APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Use the runner's preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || {
            # surface the real error as annotations (readable on the run page without digging through logs)
            { grep -E "\.java:[0-9]+: error|\.xml.*error|AAPT|error:" build.log | head -15; sed -n '/What went wrong/,/Try:/p' build.log | head -25; } | grep -v "^> Task" | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with: { name: streak-calendar-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish APK as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          make_latest: true
          body: Open this page on the phone and tap app-debug.apk to install.
          files: android/app/build/outputs/apk/debug/app-debug.apk
